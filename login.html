<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — Dyslexia Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #0f1117 0%, #1a1d27 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #1a1d27;
            border: 1px solid #2e3347;
            border-radius: 20px;
            padding: 40px 36px;
            width: 360px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.4);
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        h2 { color: #e8eaf0; font-size: 1.6rem; margin-bottom: 6px; }
        .sub { color: #6b7280; font-size: 0.88rem; margin-bottom: 28px; }

        label { display: block; color: #9ca3af; font-size: 0.8rem; font-weight: 500; margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #2e3347;
            background: #0f1117;
            color: #e8eaf0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 18px;
            font-family: 'DM Sans', sans-serif;
        }
        input:focus { border-color: #4f8ef7; }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            font-family: 'DM Sans', sans-serif;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .msg { text-align: center; margin-top: 14px; font-size: 0.9rem; font-weight: 500; min-height: 22px; }
        .error   { color: #ef4444; }
        .success { color: #22c55e; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #6b7280; }
        .footer-link a { color: #4f8ef7; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">📖 Dyslexia Reader</div>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to continue reading</p>

    <label>Username</label>
    <input type="text" id="username" placeholder="Your username" autocomplete="username">

    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') login()">

    <button id="loginBtn" onclick="login()">Sign In</button>
    <p class="msg" id="msg"></p>

    <div class="footer-link">No account? <a href="signup.html">Create one</a></div>
</div>

<script>
async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg      = document.getElementById('msg');
    const btn      = document.getElementById('loginBtn');

    msg.className = '';
    msg.innerText = '';

    if (!username || !password) {
        msg.className = 'msg error';
        msg.innerText = 'Please enter username and password.';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Signing in…';

    const form = new FormData();
    form.append('username', username);
    form.append('password', password);

    try {
        const res  = await fetch('login.php', { method: 'POST', body: form });
        const data = await res.json();

        if (data.success) {
            msg.className = 'msg success';
            msg.innerText = data.message;
            setTimeout(() => window.location.href = data.redirect || 'index.html', 900);
        } else {
            msg.className = 'msg error';
            msg.innerText = data.message;
            btn.disabled = false;
            btn.innerText = 'Sign In';
        }
    } catch {
        msg.className = 'msg error';
        msg.innerText = 'Server error. Make sure XAMPP is running.';
        btn.disabled = false;
        btn.innerText = 'Sign In';
    }
}
</script>
</body>
</html>
